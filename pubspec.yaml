name: flutter_lite_camera
description: "A lightweight Flutter camera plugin for Windows, Linux, and macOS. Renders previews natively through Flutter textures and captures RGB frames on demand for image processing."
version: 0.1.0
homepage: https://github.com/yushulx/flutter_lite_camera
repository: https://github.com/yushulx/flutter_lite_camera

environment:
  sdk: ^3.6.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: FlutterLiteCameraPlugin
      macos:
        pluginClass: FlutterLiteCameraPlugin
      windows:
        pluginClass: FlutterLiteCameraPluginCApi

