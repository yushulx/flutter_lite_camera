name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Static analysis and Dart unit tests (method-channel level, no camera
  # hardware required).
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ---------------------------------------------------------------------------
  # Native compilation checks: building the example app compiles the plugin's
  # C++/Swift sources for each desktop platform.
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build windows
        working-directory: example

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: example
      - run: flutter build linux
        working-directory: example

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build macos
        working-directory: example

  # ---------------------------------------------------------------------------
  # Runtime tests on a real Flutter engine.
  #
  # The integration test enumerates cameras and skips the open/preview/capture
  # pipeline when no device is present, so it passes on camera-less runners
  # while still verifying plugin registration and the method channel.
  # ---------------------------------------------------------------------------
  runtime-test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter test integration_test -d windows
        working-directory: example

  runtime-test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
        working-directory: example
      - name: Fix Dynamsoft dylib install names
        # flutter_barcode_sdk_macos ships dylibs with broken install names
        # (e.g. libDynamicPdf.dylib identifies as
        # @loader_path/libDynamicPdfRx64_<version>.dylib, and
        # libDynamsoftNeuralNetwork.dylib has a bare name), so any app
        # linking them crashes at launch. Normalize all ids and internal
        # references to @rpath form and re-sign ad-hoc.
        run: |
          LIBDIR=$(dirname "$(find "$PUB_CACHE/hosted/pub.dev" -name "libDynamicPdf.dylib" -path "*flutter_barcode_sdk_macos*" | head -1)")
          echo "Patching dylibs in $LIBDIR"
          for f in "$LIBDIR"/*.dylib; do
            for ref in $(otool -L "$f" | awk 'NR>2 {print $1}'); do
              case "$ref" in
                @rpath/*|/usr/lib/*|/System/*|@executable_path/*) ;;
                *) install_name_tool -change "$ref" "@rpath/$(basename "$ref")" "$f" || true ;;
              esac
            done
            install_name_tool -id "@rpath/$(basename "$f")" "$f" || true
            codesign --force --sign - "$f" || true
          done
      - name: Probe direct app launch
        # The app bundles third-party dylibs via flutter_barcode_sdk_macos;
        # launch it directly to surface dyld/load errors that the test
        # harness only reports as "Unable to start the app".
        working-directory: example
        run: |
          flutter build macos --debug
          BIN="build/macos/Build/Products/Debug/flutter_lite_camera_example.app/Contents/MacOS/flutter_lite_camera_example"
          "$BIN" > /tmp/app_out.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "APP_LAUNCH_OK"
            kill $PID || true
          else
            echo "APP_LAUNCH_FAILED"
            wait $PID || echo "exit code: $?"
          fi
          echo "=== app output ==="
          cat /tmp/app_out.log
      # Launching a desktop app on the macOS runner occasionally fails with
      # "Unable to start the app on the device"; retry a few times.
      - name: Run integration tests
        run: |
          for i in 1 2 3; do
            flutter test integration_test -d macos && exit 0
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          exit 1
        working-directory: example

  # Full end-to-end test with a virtual camera: v4l2loopback provides
  # /dev/video0 and ffmpeg feeds a test pattern into it, so the camera
  # pipeline (open -> startPreview -> captureFrame -> stopPreview) runs for
  # real, including the capture thread, texture registration and frame cache.
  #
  # The stock azure kernel ships no V4L2 core modules, so the job first
  # installs the generic Ubuntu kernel and reboots the runner into it.
  runtime-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            xvfb ffmpeg v4l-utils build-essential git
      - name: Install the generic kernel and reboot
        # The azure kernel lacks the V4L2 core (videodev/videobuf2), which
        # v4l2loopback depends on. The generic kernel includes them. The
        # reboot is delayed and detached so this step exits cleanly; the
        # runner re-runs the interrupted next step after coming back.
        run: |
          sudo apt-get install -y linux-image-generic linux-headers-generic
          NEW_KERNEL=$(ls /boot/vmlinuz-*-generic | sort -V | tail -n1 | sed 's|/boot/vmlinuz-||')
          echo "Rebooting into kernel: $NEW_KERNEL"
          sudo sed -i 's/^GRUB_DEFAULT=.*/GRUB_DEFAULT=saved/' /etc/default/grub
          sudo update-grub
          sudo grub-set-default "Advanced options for Ubuntu>Ubuntu, with Linux $NEW_KERNEL"
          (sleep 15 && sudo reboot) &
      - name: Verify the generic kernel is running
        run: |
          uname -r
          if [[ "$(uname -r)" == *azure* ]]; then
            echo "Still on the azure kernel; reboot did not switch kernels"
            exit 1
          fi
      - name: Build and install v4l2loopback
        run: |
          git clone --depth 1 https://github.com/umlaeute/v4l2loopback.git /tmp/v4l2loopback
          make -C /tmp/v4l2loopback
          sudo make -C /tmp/v4l2loopback install
          sudo depmod -a
      - name: Start a virtual camera
        run: |
          if ! sudo modprobe v4l2loopback video_nr=0 card_label="CI Camera" exclusive_caps=1; then
            echo "=== dmesg tail ==="
            sudo dmesg | tail -30
            exit 1
          fi
          test -e /dev/video0
          v4l2-ctl --device=/dev/video0 --info || true
      - name: Feed a test pattern into the virtual camera
        run: |
          nohup ffmpeg -loglevel error -re -f lavfi -i testsrc=size=640x480:rate=30 \
            -pix_fmt yuyv422 -f v4l2 /dev/video0 > ffmpeg.log 2>&1 &
          sleep 2
          cat ffmpeg.log || true
      - name: Run integration tests with a display
        run: |
          flutter pub get
          xvfb-run -a flutter test integration_test -d linux
        working-directory: example
