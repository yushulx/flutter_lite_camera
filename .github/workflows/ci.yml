name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Static analysis and Dart unit tests (method-channel level, no camera
  # hardware required).
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ---------------------------------------------------------------------------
  # Native compilation checks: building the example app compiles the plugin's
  # C++/Swift sources for each desktop platform.
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build windows
        working-directory: example

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
        working-directory: example
      - run: flutter build linux
        working-directory: example

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build macos
        working-directory: example

  # ---------------------------------------------------------------------------
  # Runtime tests on a real Flutter engine.
  #
  # The integration test enumerates cameras and skips the open/preview/capture
  # pipeline when no device is present, so it passes on camera-less runners
  # while still verifying plugin registration and the method channel.
  # ---------------------------------------------------------------------------
  runtime-test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter test integration_test -d windows
        working-directory: example

  runtime-test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
        working-directory: example
      - name: Fix Dynamsoft dylib install names
        # flutter_barcode_sdk_macos ships dylibs with broken install names
        # (e.g. libDynamicPdf.dylib identifies as
        # @loader_path/libDynamicPdfRx64_<version>.dylib, and
        # libDynamsoftNeuralNetwork.dylib has a bare name), so any app
        # linking them crashes at launch. Normalize all ids and internal
        # references to @rpath form and re-sign ad-hoc.
        run: |
          LIBDIR=$(dirname "$(find "$PUB_CACHE/hosted/pub.dev" -name "libDynamicPdf.dylib" -path "*flutter_barcode_sdk_macos*" | head -1)")
          echo "Patching dylibs in $LIBDIR"
          for f in "$LIBDIR"/*.dylib; do
            for ref in $(otool -L "$f" | awk 'NR>2 {print $1}'); do
              case "$ref" in
                @rpath/*|/usr/lib/*|/System/*|@executable_path/*) ;;
                *) install_name_tool -change "$ref" "@rpath/$(basename "$ref")" "$f" || true ;;
              esac
            done
            install_name_tool -id "@rpath/$(basename "$f")" "$f" || true
            codesign --force --sign - "$f" || true
          done
      - name: Probe direct app launch
        # The app bundles third-party dylibs via flutter_barcode_sdk_macos;
        # launch it directly to surface dyld/load errors that the test
        # harness only reports as "Unable to start the app".
        working-directory: example
        run: |
          flutter build macos --debug
          BIN="build/macos/Build/Products/Debug/flutter_lite_camera_example.app/Contents/MacOS/flutter_lite_camera_example"
          "$BIN" > /tmp/app_out.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "APP_LAUNCH_OK"
            kill $PID || true
          else
            echo "APP_LAUNCH_FAILED"
            wait $PID || echo "exit code: $?"
          fi
          echo "=== app output ==="
          cat /tmp/app_out.log
      # Launching a desktop app on the macOS runner occasionally fails with
      # "Unable to start the app on the device"; retry a few times.
      - name: Run integration tests
        run: |
          for i in 1 2 3; do
            flutter test integration_test -d macos && exit 0
            echo "Attempt $i failed, retrying..."
            sleep 10
          done
          exit 1
        working-directory: example

  # Full end-to-end test of the camera pipeline. GitHub runners have no
  # camera and the azure kernel ships no V4L2 core modules (and mid-job
  # reboots are not supported, so installing a generic kernel does not
  # help), so a small LD_PRELOAD shim (ci/fake_v4l2.c) emulates the V4L2
  # ioctls in userspace and serves a synthetic test pattern. This exercises
  # the real plugin code: open -> capture thread -> texture registration ->
  # frame cache -> captureFrame.
  runtime-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            xvfb build-essential
      - name: Build the fake V4L2 device shim
        run: gcc -shared -fPIC -O2 -o ci/fake_v4l2.so ci/fake_v4l2.c -ldl
      - name: Run integration tests with a display
        run: |
          flutter pub get
          xvfb-run -a env LD_PRELOAD="$GITHUB_WORKSPACE/ci/fake_v4l2.so" flutter test integration_test -d linux
        working-directory: example
