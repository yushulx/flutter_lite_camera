<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    App entry point for the Flutter example.

    Served standalone by `flutter run -d chrome` and embedded as the iframe of
    the hosted demo page at
    https://www.dynamsoft.com/codepool/demos/flutter-camera-barcode-scanner/.

    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from. The path
    has to start and end with a slash. It is replaced by the value of the
    `--base-href` argument passed to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Flutter camera preview with multi-barcode decoding, captured as RGB888 frames by flutter_lite_camera and decoded with Dynamsoft Barcode Reader.">
  <meta name="robots" content="noindex">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flutter Camera Barcode Scanner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Dynamsoft Barcode Reader web SDK, required by flutter_barcode_sdk on web.
       Must load before the Flutter app bootstraps. -->
  <!-- The ?v= query defeats a stale CDN copy cached by the browser: without it a
       profile that visited an older build can keep running an old bundle for a
       day and fail license activation with -30063 "No license found". -->
  <script src="https://cdn.jsdelivr.net/npm/dynamsoft-barcode-reader-bundle@11.6.3200/dist/dbr.bundle.js?v=11.6.3200"></script>

  <!--
    License selection — the same two-path switch used by every Codepool demo.

    The hosted demo is served from www.dynamsoft.com/codepool/demos/, where the
    Codepool license (bound to dynamsoft.com) activates without a sign-up.
    Anywhere else — localhost, a fork, a self-hosted copy — that key cannot
    activate, so the page falls back to the SDK's public 24-hour trial key and
    reports `license_fallback` through the shared analytics helper.

    The Flutter side reads the key through example/lib/demo_bridge.dart.
  -->
  <script>
    (function () {
      var BOUND_HOSTS = ['dynamsoft.com'];
      var CODEPOOL_LICENSE_KEY = 'DLS2eyJoYW5kc2hha2VDb2RlIjoiMjAwMDAwLTEwMTY0ODQ5MCIsIm1haW5TZXJ2ZXJVUkwiOiJodHRwczovL21sdHMuZHluYW1zb2Z0LmNvbS8iLCJvcmdhbml6YXRpb25JRCI6IjIwMDAwMCIsInN0YW5kYnlTZXJ2ZXJVUkwiOiJodHRwczovL3NsdHMuZHluYW1zb2Z0LmNvbS8iLCJjaGVja0NvZGUiOjE0MDA4MDY1Mjl9';
      var TRIAL_LICENSE_KEY = 'DLS2eyJoYW5kc2hha2VDb2RlIjoiMjAwMDAxLTE2NDk4Mjk3OTI2MzUiLCJvcmdhbml6YXRpb25JRCI6IjIwMDAwMSIsInNlc3Npb25QYXNzd29yZCI6IndTcGR6Vm05WDJrcEQ5YUoifQ==';

      var host = window.location.hostname.toLowerCase();
      var bound = BOUND_HOSTS.some(function (candidate) {
        return host === candidate || host.endsWith('.' + candidate);
      });

      window.FLUTTER_LITE_CAMERA_LICENSE = bound ? CODEPOOL_LICENSE_KEY : TRIAL_LICENSE_KEY;

      if (!bound) {
        console.info('[demo] Using the SDK trial license: the Codepool license is bound to '
          + BOUND_HOSTS.join(', ') + ' and cannot activate on "' + host + '".');
        // The app runs in an iframe of the demo page, so the shared tracker
        // lives on the parent. Both lookups are optional.
        var analytics = (window.parent && window.parent.DemoAnalytics) || window.DemoAnalytics;
        if (analytics && typeof analytics.action === 'function') {
          analytics.action('license_fallback', { host: host });
        }
      }
    })();
  </script>

  <title>Flutter Camera Barcode Scanner</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
